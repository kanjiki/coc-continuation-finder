<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>継続先データ編集</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="styles.css"><style>.admin{width:min(1100px,calc(100% - 24px));margin:28px auto}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.list{max-height:65vh;overflow:auto;border:1px solid var(--line);border-radius:12px}.item{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px}.item.active{background:var(--soft)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.form label{display:block;font-size:.8rem;font-weight:700;margin-bottom:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.toolbar a{width:auto}.danger{background:#8a3333!important}.help{font-size:.82rem;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:280px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style><script defer src="data/sources.js"></script><script defer src="data/part1.js"></script><script defer src="data/part2.js"></script><script defer src="data/part3.js"></script><script defer src="data/part4.js"></script><script defer src="data/part5.js"></script><script defer src="data/custom.js"></script><script defer src="manage.js"></script></head><body><main class="admin"><p class="eyebrow">OWNER EDITOR</p><h1>継続先データ編集</h1><p class="muted">公開ページとは別の管理画面です。Google Sheetsで <code>公開OK</code> にした内容は3時間ごとに自動同期されます。すぐ反映したい場合は手動同期を使えます。</p><section class="panel"><h2>公開・同期</h2><div class="toolbar"><a class="button" href="https://github.com/kanjiki/coc-continuation-finder/actions/workflows/sync-sheet.yml" target="_blank" rel="noopener">今すぐ同期</a><a class="button" href="./" target="_blank">公開画面を確認</a><button id="download">編集データをダウンロード</button><a class="button" id="upload" href="https://github.com/kanjiki/coc-continuation-finder/upload/main/data" target="_blank">GitHubへアップロード</a></div><p class="help">Sheetsで確認・編集した場合：1) <b>今すぐ同期</b> → 2) GitHub Actionsで <b>Run workflow</b> → 3) 完了後に公開画面を確認。通常は3時間ごとに自動同期されます。<br>この画面で直接編集した場合：ダウンロードした <code>data/custom.js</code> をGitHubへ上書きしてください。</p></section><div class="grid"><section class="panel"><input id="filter" type="text" placeholder="元／継続先を検索"><div class="toolbar" style="margin:10px 0"><button id="new">新規追加</button></div><div id="list" class="list"></div></section><section class="panel"><div class="form"><div><label>元シナリオ</label><select id="src"></select></div><div><label>継続先</label><input id="target" type="text"></div><div><label>継続形態</label><select id="scope"><option>自陣全員</option><option>自陣全員／複数人</option><option>複数人</option><option>ペア</option><option>1人／HO単位</option><option>指定なし</option></select></div><div><label>状態</label><select id="status"><option>推薦</option><option>注意</option></select></div><div><label>確認表示</label><select id="evidence"><option>実卓完走例あり</option><option>実卓使用例あり</option><option>公式情報あり</option><option>継続実例あり</option><option>利用時要確認</option></select></div><div></div><div class="wide"><label>推薦理由</label><textarea id="reason" rows="4"></textarea></div><div><label>販売元1</label><select id="p1"><option value="">なし</option><option>BOOTH</option><option>pixiv</option><option>TALTO</option><option>その他</option></select><input id="u1" type="url" placeholder="https://..."></div><div><label>販売元2</label><select id="p2"><option value="">なし</option><option>BOOTH</option><option>pixiv</option><option>TALTO</option><option>その他</option></select><input id="u2" type="url" placeholder="https://..."></div></div><div class="toolbar" style="margin-top:14px"><button id="save">保存</button><button id="remove" class="danger">削除</button></div><p id="msg" class="help"></p></section></div></main></body></html>
